- insert:
    - id: baseseer
      name: dsh-baseseer
    - id: preset-baseseer-planning
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: baseseer-planning
        name: Planning
        description: 'BaseSeer planning: map the project, maintain the shared plan, and have it built on your go.'
        order: 5
        # Presets own their composition; delegation belongs to the build lead,
        # not the planner. Host services and permission enforcement stay outside.
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. Conversational agreement is not approval to implement.

                    Inspect the repository using non-mutating reads, searches and checks. Do not edit files, change configuration, run mutating commands or commit. Tool availability does not grant permission: these planning rules override guidance to use mutation tools. Do not use todo_write for this planning phase.

                    Resolve discoverable facts by inspection. Ask the user only about choices or material ambiguity that inspection cannot resolve. Make the plan decision-complete, including the goal, affected interfaces, implementation steps, verification and assumptions.

                    Present the complete plan through exit_plan_mode as the only and final tool call in that response. Implement only in a later step after approval. If review rejects it, revise and present again. If review is unavailable, remain in plan mode. Leaving host plan mode does not start a BaseSeer build; the owner must request /baseseer build.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
